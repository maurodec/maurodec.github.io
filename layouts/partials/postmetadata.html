<div id="post-metadata">
    <span class="info-container extra-info">
        {{ .Date.Format "January _2 - 2006" }} <b>&middot;</b> <a href="{{ .Permalink }}">Permalink</a>
    </span>

    <div class="tag-container">
        {{ range .Params.tags }}
            <span class="tag">{{ . }}</span>
        {{ end }}
    </div>
</div>
